apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oas-enhancer.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oas-enhancer.labels" . | nindent 4 }}
    {{- include "oas-enhancer.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oas-enhancer.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oas-enhancer.labels" . | nindent 8 }}
        {{- include "oas-enhancer.backend.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: {{ .Values.backend.securityContext.fsGroup }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
      containers:
        - name: backend
          image: {{ include "oas-enhancer.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - ".vault/secrets.apisecrets exec python src/api_service.py"
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- range $key, $val := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "oas-enhancer.secretName" . }}
                  key: OPENAI_API_KEY
          livenessProbe:
            httpGet:
              path: /oas-enhancer/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /oas-enhancer/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /app/src/logs
            {{- if .Values.backend.persistence.cache.enabled }}
            - name: cache
              mountPath: /app/.cache
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if .Values.backend.persistence.cache.enabled }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "oas-enhancer.fullname" . }}-cache
        {{- end }}

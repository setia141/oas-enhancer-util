<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}OAS Enhancer{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
    #app-header { background: #fff; border-bottom: 1px solid #e8eaed; padding: 0 24px; display: flex; align-items: center; height: 52px; position: sticky; top: 0; z-index: 200; }
    #app-header .logo  { font-size: 18px; margin-right: 8px; }
    #app-header .title { font-weight: 700; font-size: 15px; }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>

<header id="app-header">
  <div class="logo">📄</div>
  <div class="title">OAS Enhancer</div>
</header>

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>

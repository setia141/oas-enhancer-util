services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: flask_ui/Dockerfile
    env_file: flask_ui/.env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

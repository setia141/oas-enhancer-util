components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required: [code, message]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
      required: [email, password, firstName, lastName]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        tokenType:
          type: string
      required: [accessToken, refreshToken, expiresIn, tokenType]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
      required: [token, password, confirmPassword]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [customer, admin, manager]
        status:
          type: string
          enum: [active, inactive, suspended]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, firstName, lastName, role, status]

    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [customer, admin, manager]
        status:
          type: string
          enum: [active, inactive, suspended]

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          format: uri
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
        language:
          type: string
        timezone:
          type: string

    Address:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
        isDefault:
          type: boolean
        phone:
          type: string
      required: [firstName, lastName, line1, city, postalCode, country]

    Product:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        compareAtPrice:
          type: number
          format: float
        categoryId:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]
        tags:
          type: array
          items:
            type: string
        weight:
          type: number
          format: float
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, sku, name, price, status]

    ProductList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateProductRequest:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        compareAtPrice:
          type: number
          format: float
        categoryId:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]
        tags:
          type: array
          items:
            type: string
        weight:
          type: number
          format: float
        dimensions:
          $ref: '#/components/schemas/Dimensions'
      required: [sku, name, price]

    Dimensions:
      type: object
      properties:
        length:
          type: number
          format: float
        width:
          type: number
          format: float
        height:
          type: number
          format: float
        unit:
          type: string
          enum: [cm, in]

    ProductImage:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        alt:
          type: string
        position:
          type: integer
          minimum: 0

    ProductVariant:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
        attributes:
          type: object
          additionalProperties:
            type: string
        stock:
          type: integer
          minimum: 0
      required: [sku, name, price]

    BulkActionResult:
      type: object
      properties:
        success:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              error:
                type: string

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        parentId:
          type: string
        imageUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [active, inactive]
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, status]

    CategoryTree:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/CategoryTree'

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
        status:
          type: string
          enum: [active, inactive]
        sortOrder:
          type: integer
      required: [name]

    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled, refunded]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          format: float
        discount:
          type: number
          format: float
        shippingCost:
          type: number
          format: float
        tax:
          type: number
          format: float
        total:
          type: number
          format: float
        currency:
          type: string
          minLength: 3
          maxLength: 3
        shippingAddress:
          $ref: '#/components/schemas/Address'
        billingAddress:
          $ref: '#/components/schemas/Address'
        paymentMethod:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, orderNumber, userId, status, total, currency]

    OrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'

    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        variantId:
          type: string
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: float
        totalPrice:
          type: number
          format: float
      required: [id, productId, name, sku, quantity, unitPrice, totalPrice]

    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              variantId:
                type: string
              quantity:
                type: integer
                minimum: 1
            required: [productId, quantity]
        shippingAddressId:
          type: string
        billingAddressId:
          type: string
        shippingMethodId:
          type: string
        paymentMethodId:
          type: string
        couponCode:
          type: string
        notes:
          type: string
      required: [items, shippingAddressId, paymentMethodId]

    RefundRequest:
      type: object
      properties:
        amount:
          type: number
          format: float
        reason:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId:
                type: string
              quantity:
                type: integer
      required: [reason]

    Refund:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        amount:
          type: number
          format: float
        reason:
          type: string
        status:
          type: string
          enum: [pending, processed, failed]
        createdAt:
          type: string
          format: date-time

    TrackingInfo:
      type: object
      properties:
        trackingNumber:
          type: string
        carrier:
          type: string
        status:
          type: string
        estimatedDelivery:
          type: string
          format: date
        events:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              location:
                type: string
              description:
                type: string

    Cart:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
        itemCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        variantId:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer
          minimum: 1
        imageUrl:
          type: string
          format: uri

    CartItemRequest:
      type: object
      properties:
        productId:
          type: string
        variantId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [productId, quantity]

    CheckoutRequest:
      type: object
      properties:
        shippingAddressId:
          type: string
        billingAddressId:
          type: string
        shippingMethodId:
          type: string
        paymentMethodId:
          type: string
        couponCode:
          type: string
      required: [shippingAddressId, shippingMethodId, paymentMethodId]

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [card, bank_transfer, paypal, apple_pay, google_pay]
        last4:
          type: string
        brand:
          type: string
        expiryMonth:
          type: integer
        expiryYear:
          type: integer
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AddPaymentMethodRequest:
      type: object
      properties:
        type:
          type: string
          enum: [card, bank_transfer, paypal]
        token:
          type: string
        isDefault:
          type: boolean
      required: [type, token]

    ProcessPaymentRequest:
      type: object
      properties:
        orderId:
          type: string
        paymentMethodId:
          type: string
        amount:
          type: number
          format: float
        currency:
          type: string
          minLength: 3
          maxLength: 3
      required: [orderId, paymentMethodId, amount, currency]

    PaymentResult:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        amount:
          type: number
          format: float
        currency:
          type: string
        transactionId:
          type: string
        createdAt:
          type: string
          format: date-time

    PaymentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResult'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ShippingMethod:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        carrier:
          type: string
        estimatedDays:
          type: integer
        price:
          type: number
          format: float

    ShippingCalculateRequest:
      type: object
      properties:
        destinationCountry:
          type: string
        destinationPostalCode:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
      required: [destinationCountry, items]

    ShippingRate:
      type: object
      properties:
        methodId:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
        estimatedDays:
          type: integer
        currency:
          type: string

    CreateLabelRequest:
      type: object
      properties:
        orderId:
          type: string
        shippingMethodId:
          type: string
        fromAddress:
          $ref: '#/components/schemas/Address'
        toAddress:
          $ref: '#/components/schemas/Address'
      required: [orderId, shippingMethodId, toAddress]

    ShippingLabel:
      type: object
      properties:
        id:
          type: string
        trackingNumber:
          type: string
        labelUrl:
          type: string
          format: uri
        carrier:
          type: string
        createdAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        body:
          type: string
        helpfulCount:
          type: integer
        verifiedPurchase:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReviewList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        pagination:
          $ref: '#/components/schemas/Pagination'
        averageRating:
          type: number
          format: float
        totalCount:
          type: integer

    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        body:
          type: string
      required: [rating, body]

    InventoryItem:
      type: object
      properties:
        productId:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
        lowStockThreshold:
          type: integer
        updatedAt:
          type: string
          format: date-time

    InventoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UpdateInventoryRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0

    InventoryAdjustment:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        adjustment:
          type: integer
        reason:
          type: string
          enum: [received, damaged, returned, correction, theft]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [productId, adjustment, reason]

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        data:
          type: object
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
        unreadCount:
          type: integer

    NotificationPreferences:
      type: object
      properties:
        orderUpdates:
          type: boolean
        promotions:
          type: boolean
        lowStockAlerts:
          type: boolean
        newReviews:
          type: boolean
        emailEnabled:
          type: boolean
        pushEnabled:
          type: boolean
        smsEnabled:
          type: boolean

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    SalesReport:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        totalRevenue:
          type: number
          format: float
        totalOrders:
          type: integer
        averageOrderValue:
          type: number
          format: float
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              revenue:
                type: number
                format: float
              orders:
                type: integer

    InventoryReport:
      type: object
      properties:
        totalProducts:
          type: integer
        totalValue:
          type: number
          format: float
        lowStockCount:
          type: integer
        outOfStockCount:
          type: integer
        generatedAt:
          type: string
          format: date-time

    CustomerReport:
      type: object
      properties:
        totalCustomers:
          type: integer
        newCustomers:
          type: integer
        activeCustomers:
          type: integer
        churnedCustomers:
          type: integer
        averageLifetimeValue:
          type: number
          format: float

    SearchResults:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        total:
          type: integer

    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
      required: [url, events]

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        webhookId:
          type: string
        event:
          type: string
        statusCode:
          type: integer
        responseBody:
          type: string
        duration:
          type: integer
        success:
          type: boolean
        createdAt:
          type: string
          format: date-time
